<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout</title>
    <style>
        body{
            font-family: Arial, sans-serif;
            background: #f7f7f7;
            margin: 0;
            padding: 20px;
        }
        .checkout-container{
            max-width: 500px;
            margin: 0 auto;
            background: #fff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 6px 18px rgba(0,0,0,0.08);
        }
        h1{
            margin-top: 0;
            color: #222;
            text-align: center;
        }
        .product-summary,
        .address-form{
            margin-top: 20px;
        }
        .product-summary p{
            margin: 8px 0;
            font-size: 14px;
            color: #333;
        }
        .address-form label{
            display: block;
            margin: 12px 0 6px;
            font-weight: bold;
            color: #555;
        }
        .address-form input,
        .address-form textarea{
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 14px;
            box-sizing: border-box;
        }
        .address-form textarea{
            resize: vertical;
            min-height: 100px;
        }
        .checkout-btn{
            width: 100%;
            margin-top: 20px;
            padding: 12px;
            border: none;
            background: #4CAF50;
            color: white;
            font-size: 16px;
            border-radius: 10px;
            cursor: pointer;
        }
        .checkout-btn:hover{
            background: #45a049;
        }
        .message{
            margin-top: 15px;
            padding: 12px;
            background: #eef7ed;
            border: 1px solid #c9e7c1;
            border-radius: 8px;
            color: #2d6c2f;
            display: none;
        }
    </style>
</head>
<body>
    <div class="checkout-container">
        <h1>Checkout</h1>
        <div class="product-summary">
            <p><strong>Product:</strong> <span id="productName">-</span></p>
            <p><strong>Price:</strong> <span id="productPrice">-</span></p>
        </div>
        <form class="address-form" id="checkoutForm">
            <label for="fullName">Full Name</label>
            <input type="text" id="fullName" name="fullName" required>

            <label for="email">Email</label>
            <input type="email" id="email" name="email" required>

            <label for="phone">Phone Number</label>
            <input type="tel" id="phone" name="phone" required>

            <label for="address">Shipping Address</label>
            <textarea id="address" name="address" required></textarea>

            <button type="submit" class="checkout-btn">Place Order</button>
        </form>
        <div class="message" id="confirmationMessage"></div>
    </div>

    <script>
        function getQueryParam(name) {
            let params = new URLSearchParams(window.location.search);
            return params.get(name) || "";
        }

        document.addEventListener("DOMContentLoaded", function() {
            let name = decodeURIComponent(getQueryParam("name"));
            let price = decodeURIComponent(getQueryParam("price"));
            document.getElementById("productName").innerText = name || "No item selected";
            document.getElementById("productPrice").innerText = price || "-";

            let form = document.getElementById("checkoutForm");
            let message = document.getElementById("confirmationMessage");

            form.addEventListener("submit", function(event) {
                event.preventDefault();
                message.innerText = `Thank you, ${document.getElementById("fullName").value}! Your order for ${name} has been placed. We will ship it to ${document.getElementById("address").value}.`;
                message.style.display = "block";
                form.reset();
            });
        });
    </script>
</body>
</html>
